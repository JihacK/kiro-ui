name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (server feature)
        run: cargo clippy -p kiro-ui --all-targets --features server -- -D warnings

      - name: Check wasm UI
        run: cargo check -p kiro-ui-web --target wasm32-unknown-unknown

      - name: Tests
        run: cargo test --workspace

      - name: Build wasm UI
        run: cargo xtask web

      - name: Build release with browser mode
        run: cargo build --release -p kiro-ui --features server
