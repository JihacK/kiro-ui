[package]
name = "kiro-ui-server"
description = "Optional browser mode: serves the web frontend and exposes kiro-ui-core over HTTP + WebSocket"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "kiro-ui-server"
path = "src/main.rs"

[dependencies]
kiro-ui-core = { path = "../kiro-ui-core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
rust-embed = "8.13.0"
mime_guess = "2.0.5"
regex = "1.13.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
