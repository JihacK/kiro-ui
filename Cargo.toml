[workspace]
resolver = "2"
members = ["crates/kiro-ui-core", "crates/kiro-ui-app", "crates/kiro-ui", "crates/kiro-ui-web", "xtask"]
# `cargo run` / `cargo build` without -p target the app.
default-members = ["crates/kiro-ui"]

[workspace.package]
version = "1.3.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Guyon IT Consulting <jerome.guyon@gmail.com>"]

# Small, fast release binaries: the app is I/O bound, so size wins over peak speed.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
